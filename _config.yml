# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

title: Simon Leboucher
description: Data and software engineer
baseurl: ""
url: "https://simonlb.com"
og_image: /assets/img/profile-pic.png
google_analytics: "UA-121636368-3"

header:
  pages:
    - name: Home
      slug: /
    # - name: Work
    - name: Blog
      slug: https://simonlb.writizzy.com/

footer:
  show_powered_by: true
  contact:
    - type: email
      name: Email
      value: contact@simonlb.com
  follow:
    # - type: twitter
    #   name: Twitter
    #   link: http://twitter.com/YourTwitterUsername
    #   username: "@YourTwitterUsername"
    # - type: facebook
    #   name: Facebook
    #   link: http://facebook.com/YourFacebookUsername
    - type: linkedin
      name: LinkedIn
      link: http://linkedin.com/in/simon-leboucher
    - type: github
      name: GitHub
      link: http://github.com/simonlbcr
    # - type: dribbble
    #   name: Dribbble
    #   link: https://dribbble.com/YourDribbbleUsername
    # - type: rss
    #   name: RSS
    #   link: /feed.xml

# Build settings
markdown: kramdown
sass:
    style: :compressed
plugins:
  - jekyll-feed

# Excluded items
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - feed.xml
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Used for defeating caching
version: 1
